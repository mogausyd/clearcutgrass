<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0c0b0b;
            color: #0c0b0b;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0 16px;
        }
        h1 {
            margin-top: 40px;
            font-size: clamp(1.6rem, 6vw, 2.5rem);
            color: #cccccc;
        }

        /* Flags row */
        .flags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }
        .flags img {
            width: 90px;
            max-width: 22vw;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .flags img:hover {
            transform: scale(1.1);
        }

        .gallery-item {
            margin-bottom: 40px;
        }
        .gallery-item img {
            width: 100px;
            max-width: 25vw;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-item img:hover {
            transform: scale(1.1);
        }
        .caption {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #cccccc;
        }

        /* Icon links row */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 60px;
        }
        .container img {
            width: 120px;
            max-width: 25vw;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .container img:hover {
            transform: scale(1.1);
        }

        .page {
            margin-top: 40px;
        }

        /* Small phone adjustments */
        @media (max-width: 480px) {
            h1 {
                margin-top: 24px;
            }
            .container {
                gap: 20px;
                margin-top: 40px;
            }
            .flags {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>CLEARCUTGRASS</h1>

    <div class="flags">
        <img src="s-africa flag gif.gif" alt="South-Africa Icon" />
        <img src="s-africa flag gif.gif" alt="South-Africa Icon" />
        <img src="s-africa flag gif.gif" alt="South-Africa Icon" />
        <img src="s-africa flag gif.gif" alt="South-Africa Icon" />
        <img src="s-africa flag gif.gif" alt="South-Africa Icon" />
        <img src="s-africa flag gif.gif" alt="South-Africa Icon" />
    </div>

    <div class="container">
        <a href="email.html">
            <img src="email gif.gif" alt="Email Icon" />
        </a>
        <a href="projector.html">
            <img src="projector04 GIF.gif" alt="Projector Icon" />
        </a>
        <a href="camera.html">
            <img src="camera flash gif.gif" alt="Camera Icon" />
        </a>
    </div>
</body>
</html>
