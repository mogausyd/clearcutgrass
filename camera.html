<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Flash Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0e0d0d;
            color: rgb(230, 220, 220);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
            font-size: clamp(1.6rem, 7vw, 2.5rem);
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            margin-top: 80px;
        }
        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .item img {
            width: 80px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .item img:hover {
            transform: scale(1.1);
        }
        .caption {
            margin-top: 10px;
            font-size: 1.2rem;
        }
        a.back {
            color: #00aaff;
            text-decoration: none;
            display: inline-block;
            margin-top: 40px;
        }

        /* Small phone adjustments */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                gap: 24px;
                margin-top: 50px;
            }
            .item img {
                width: 70px;
            }
            .caption {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>Gallery</h1>
    <div class="container">
        <div class="item">
            <a href="ILJ.html">
                <img src="file.gif" alt="File Icon" />
            </a>
            <div class="caption">ILJ</div>
        </div>
        <div class="item">
            <a href="J24.html">
                <img src="file.gif" alt="File Icon" />
            </a>
            <div class="caption">J24</div>
        </div>
    </div>
    <a href="index.html" class="back">⬅ Back to Home</a>
</body>
</html>
