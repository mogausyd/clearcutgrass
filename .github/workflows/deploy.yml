name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://clearcutgrassmagazine.co.za \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "aws-oidc-setup/*"
